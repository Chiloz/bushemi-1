<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bushemi Care: design preview v3</title>
<style>
/* ===== EASY TO CHANGE: COLOURS (from the Bushemi logo) ===== */
:root{
  --blue:#1A5CF0; --navy:#0C2E7A; --blue-soft:#E7EEFD;
  --green:#0A6F01; --green-soft:#E3F1E1;
  --bg:#F5F7FA; --ink:#13202C; --muted:#5B6A78; --line:#E0E6EC;
  --amber:#8A5300; --amber-soft:#FFF0D1; --red:#B3261E; --red-soft:#FCE8E6; --logo:none;
}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#D9E1EA;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1.45}
.phone{width:390px;height:min(840px,100vh - 20px);background:var(--bg);border-radius:38px;border:9px solid #0D1822;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 24px 60px rgba(13,24,34,.3)}
@media(max-width:440px){body{display:block;background:var(--bg)}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}}
.pv{background:var(--amber-soft);color:var(--amber);font-size:12.5px;text-align:center;padding:4px;font-weight:600;flex:none}
.top{display:none;align-items:center;justify-content:space-between;background:#fff;padding:8px 16px;border-bottom:1px solid var(--line);flex:none}
.top.on{display:flex}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--blue);font-size:18px;line-height:1.1;background:none;border:0;font-family:inherit;cursor:pointer;text-align:left}
.brand small{display:block;color:var(--green);font-weight:600;font-size:11.5px}
.lg{width:44px;height:44px;background:var(--logo) 51% 9%/175% no-repeat;flex:none}
.tr{display:flex;align-items:center;gap:10px}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib i{position:absolute;top:8px;right:9px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid #fff}
.av{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;border:3px solid var(--green-soft);cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0;font-size:17px}
.av img,.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);font-weight:800;flex:none;border-radius:50%}
.scr{flex:1;overflow-y:auto;padding:18px 16px 26px}
.p0{padding:0}
h1{font-size:25px;line-height:1.2;margin-bottom:4px}
h2{font-size:19px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 a,.lnk{color:var(--blue);font-weight:700;cursor:pointer;background:none;border:0;font:inherit;font-size:15px}
.lnk{min-height:44px;text-decoration:underline;font-size:16px}
.sub{color:var(--muted);margin-bottom:14px}.muted{color:var(--muted);font-size:15px}
.card{background:#fff;border-radius:18px;padding:16px;border:1px solid var(--line);margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;border-radius:14px;padding:12px 16px;cursor:pointer;text-decoration:none}
.btn.g{background:var(--green)}.btn.o{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.btn.go{background:#fff;color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}.btn.r{background:#fff;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}.btn.w{background:#fff;color:var(--navy)}
.btn.sm{min-height:46px;width:auto;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.45}
:focus-visible{outline:3px solid #FFB400;outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}.gap>*+*{margin-top:10px}
label,.lab{display:block;font-weight:700;margin:14px 0 6px;font-size:16px}
input,select,textarea{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:54px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:0}
textarea{min-height:88px}
.pill{display:inline-block;font-size:13.5px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.p-b{background:var(--blue-soft);color:var(--blue)}.p-g{background:var(--green-soft);color:var(--green)}.p-a{background:var(--amber-soft);color:var(--amber)}.p-r{background:var(--red-soft);color:var(--red)}.p-p{background:#EFE7FA;color:#5B2FA0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.seg{display:flex;background:rgba(255,255,255,.18);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:50px;border:0;background:none;border-radius:11px;font:inherit;font-weight:700;color:#fff;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy)}
/* welcome / auth */
.auth{background:#fff;min-height:100%;padding:24px 22px}
.auth .logo{width:180px;display:block;margin:0 auto 6px}
.ctr{text-align:center}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;min-height:42px;border:0;background:none;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;padding:0 10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);margin:14px 0;font-size:14px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.otp{letter-spacing:12px;text-align:center;font-size:28px;font-weight:700}
/* home */
.hero{background:var(--navy);color:#fff;padding:18px 16px 20px}
.hero h1{color:#fff}
.loc{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:20px;padding:8px 14px;font:inherit;font-size:15px;font-weight:600;min-height:44px;cursor:pointer;margin:6px 0 14px}
.svc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;min-height:84px}
.svc .ic{width:52px;height:52px;border-radius:16px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.svc.t .ic{background:var(--green-soft);color:var(--green)}
.ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.svc .b{flex:1}.svc b{display:block}.svc small{color:var(--muted);font-size:14.5px}
.svc .pr{font-weight:800;color:var(--navy);text-align:right;font-size:15px;white-space:nowrap}
.pkg{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pkg .card{min-width:220px;margin:0;flex:none}
.next{background:var(--blue);color:#fff;border:0}
.next .muted{color:#CFE0FF}
.quick{display:flex;gap:10px;margin:0 0 4px}
.quick>*{flex:1}
/* booking */
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--green)}
.rdo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:64px}
.rdo.on{border-color:var(--blue);background:var(--blue-soft)}
.rdo .b{flex:1}.rdo b{display:block}
.rd{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none}.rdo.on .rd{border:7px solid var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.cal button{min-height:52px;border:2px solid var(--line);background:#fff;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);padding:0;line-height:1.1}
.cal button small{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.cal button.on{background:var(--blue);border-color:var(--blue);color:#fff}.cal button.on small{color:#CFE0FF}
.cal button.hl{border-color:var(--amber)}
.note{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li .b{flex:1}.li b{display:block}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;padding-top:10px}
/* appointments */
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;border:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;min-height:46px;border:0;background:none;border-radius:11px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff}
.date{width:56px;height:60px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1;flex:none;font-size:20px}
.date small{font-size:12px;font-weight:700}
/* caregivers */
.cg{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;cursor:pointer}
.cg.pick{border-color:var(--green);background:var(--green-soft)}
.cg .ph{width:68px;height:68px;font-size:26px}
.cg small{display:block;color:var(--muted);font-size:14.5px}
.cg .ck{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.cg.pick .ck{background:var(--green);border-color:var(--green)}
.tl{list-style:none;padding:0}
.tl li{position:relative;padding:0 0 18px 46px}
.tl li:before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:3px;background:var(--line)}.tl li:last-child:before{display:none}
.tl i{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;border:3px solid var(--line);background:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tl .d i{background:var(--green);border-color:var(--green);color:#fff}.tl .d:before{background:var(--green)}
.tl .n i{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.tl b{display:block}.tl span{font-size:14.5px;color:var(--muted)}
/* payments */
.mi{width:46px;height:46px;border-radius:12px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.k-mtn{background:#F2B000;color:#222}.k-airtel{background:#E4002B}.k-zamtel{background:#0B8F3A}.k-card{background:#1C2A6B}.k-bank{background:#5B6B77}.k-cash{background:#7A5C2E}
.amt{font-size:32px;font-weight:800;text-align:center;margin:2px 0 10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--muted);margin:14px 0}.chk input{width:26px;min-height:26px;height:26px;flex:none}
.sw{width:60px;height:34px;border-radius:20px;border:0;background:#C5CCD3;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}.sw.on:after{left:30px}
details{border-bottom:1px solid var(--line);padding:4px 0}details:last-child{border:0}
summary{font-weight:700;min-height:48px;display:flex;align-items:center;cursor:pointer}
details p{color:var(--muted);padding:0 0 12px}
/* sheet */
.ov{position:absolute;inset:0;background:rgba(13,24,34,.5);display:none;align-items:flex-end;z-index:20}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px 24px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--blue-soft);border-top-color:var(--blue);margin:20px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.tick{width:80px;height:80px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:44px;display:flex;align-items:center;justify-content:center;margin:10px auto 12px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#0D1822;color:#fff;border-radius:14px;padding:12px 16px;font-weight:600;z-index:30;display:none;text-align:center}
.nav{display:none;background:#fff;border-top:1px solid var(--line);flex:none;padding:6px 6px 8px}
.nav.on{display:flex}
.nav button{flex:1;border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);min-height:60px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--blue);background:var(--blue-soft)}
.bar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
</style></head>

const S={user:null,seen:false,loc:'Chalala, Lusaka',credits:0,tab:'Upcoming',
 methods:[{id:1,k:'mtn',n:'MTN Mobile Money',s:'096 123 4567',def:true}],
 fam:[{n:'Mutinta Mwila',r:'Myself',a:'38'},{n:'Chanda Mwila',r:'Mother',a:'71'}],
 addrs:[{n:'Home',a:'Chalala, Lusaka'},{n:"Mother's house",a:'Woodlands, Lusaka'}],
 inv:[],tg:{push:true,sms:true,wa:true,bio:false},lang:'English',
 appts:[
  {id:1,svc:'tdoc',who:'Chanda Mwila',d:'2026-11-3',tm:'10:00',st:'Confirmed',addr:''},
  {id:2,svc:'nurse',who:'Chanda Mwila',d:'2026-10-20',tm:'Morning',st:'Completed',addr:'Woodlands, Lusaka',sum:'Blood pressure checked and normal. Wound dressing changed and clean. Advice: keep the area dry, drink more water. Next visit in two weeks.'}],
 pl:{view:'form',step:2,picks:[],paid:{inquiry:false,firstMonth:false}}};
const B={};   // current booking
const svcOf=id=>SERVICES.find(s=>s.id===id);
const dOf=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const first=()=>S.user.name.split(' ')[0];
const ini=()=>S.user.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const CGS=[{n:'Grace',q:'Registered Nurse',y:8,a:'Chalala',r:'4.9',rv:41,l:'English, Nyanja',p:PIC+'women/44.jpg'},
 {n:'Natasha',q:'Enrolled Nurse',y:5,a:'Kabulonga',r:'4.8',rv:23,l:'English, Bemba',p:PIC+'women/68.jpg'},
 {n:'Mercy',q:'Certified Caregiver',y:11,a:'Woodlands',r:'4.9',rv:57,l:'English, Nyanja, Bemba',p:PIC+'women/12.jpg'}];

/* ---------- shell ---------- */
const NAV=[['home','Home','home'],['appts','Appointments','appt'],['help','Help','help'],['profile','Profile','me']];
$('#nav').innerHTML=NAV.map(n=>`<button data-go="${n[0]}">${svg(n[2])}${n[1]}</button>`).join('');
const MAP={home:'home',book:'home',place:'home',appts:'appts',help:'help',profile:'profile'};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function sheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#ov').classList.add('on')}
const close=()=>$('#ov').classList.remove('on');
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});
const V={},A={};
let CUR='welcome';
function go(id){
  CUR=id;const out=['welcome','login','register','otp','admin'].includes(id);
  $('#top').classList.toggle('on',!out);$('#nav').classList.toggle('on',!out);
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===MAP[id]));
  $('#av').innerHTML=S.user?`<button class="av" data-go="profile" aria-label="My profile">${ini()}<img src="${PIC}women/65.jpg" alt="" onerror="this.remove()"></button>`:`<button class="btn sm" data-go="login">Sign in</button>`;
  $('#main').innerHTML=`<section class="scr ${out?'p0':''}" id="cur">${V[id]()}</section>`;
  close();
  if(id==='home'&&!S.seen){S.seen=true;setTimeout(()=>{if(CUR==='home')promo()},400)}
}
const keep=id=>{const y=$('#cur').scrollTop;go(id);$('#cur').scrollTop=y};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset.v,a);
});
const need=fn=>S.user?fn():sheet(`<h1>Sign in to continue</h1><p class="sub">Create an account or sign in so we can save your booking and send reminders.</p><div class="gap"><button class="btn" data-go="login">Sign in</button><button class="btn o" data-go="register">Create account</button></div>`);

/* ---------- welcome, login, register, otp ---------- */
V.welcome=()=>`<div class="auth ctr"><img class="logo" src="${LOGO}" alt="Bushemi Clinic">
 <h1 style="margin-top:6px">Care that comes to you</h1><p class="sub">Book nurses, doctors, physiotherapists and caregivers at home, or see a specialist on video.</p>
 <div class="gap" style="margin-top:20px"><button class="btn" data-go="login">Sign in</button><button class="btn o" data-go="register">Create an account</button><button class="btn" style="background:none;color:var(--blue);text-decoration:underline" data-act="guest">Continue as guest</button></div>
 <p class="muted" style="margin-top:22px">Bushemi Clinic, Plot 15564/M/S Hillview, Chalala, Lusaka</p></div>`;
A.guest=()=>go('home');
V.login=()=>`<div class="auth"><button class="lnk" data-go="welcome" style="text-decoration:none">&lt; Back</button><h1>Welcome back</h1><p class="sub">Sign in with your mobile number.</p>
 <label for="lp">Mobile number</label><input id="lp" type="tel" value="096 123 4567">
 <label for="lw">Password</label><div class="pw"><input id="lw" type="password" value="password123"><button data-act="showpw">Show</button></div>
 <div style="text-align:right"><button class="lnk" data-act="forgot">Forgot password?</button></div>
 <button class="btn" data-act="signin">Sign in</button>
 <div class="or">new to Bushemi?</div><button class="btn o" data-go="register">Create an account</button>
 <button class="lnk" data-go="admin" style="display:block;margin:14px auto 0;color:var(--muted);font-size:14px">Staff sign in</button></div>`;
A.showpw=(v,b)=>{const p=$('#lw');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Show':'Hide'};
A.forgot=()=>sheet(`<h1>Reset your password</h1><p class="sub">We will send a code by SMS.</p><label for="rp">Mobile number</label><input id="rp" value="096 123 4567"><button class="btn" style="margin-top:14px" data-act="rsent">Send code</button>`);
A.rsent=()=>{close();toast('Code sent by SMS')};
A.signin=()=>{S.user={name:'Mutinta Mwila',phone:$('#lp').value||'096 123 4567',email:'mutinta.mwila@example.com'};go('home')};
V.register=()=>`<div class="auth"><button class="lnk" data-go="welcome" style="text-decoration:none">&lt; Back</button><h1>Create your account</h1><p class="sub">We will text you a code to check your number.</p>
 <label for="rn">Full name</label><input id="rn" placeholder="For example: Mutinta Mwila">
 <label for="rm">Mobile number</label><input id="rm" type="tel" placeholder="097 000 0000">
 <label for="rw">Create a password</label><input id="rw" type="password" placeholder="At least 8 characters">
 <label class="chk"><input type="checkbox" checked><span>I agree to the Terms of Use and Privacy Policy. Bushemi keeps my health details private.</span></label>
 <button class="btn g" data-act="reg">Send code</button></div>`;
A.reg=()=>{S.tmp={name:$('#rn').value.trim()||'Mutinta Mwila',phone:$('#rm').value.trim()||'096 123 4567'};go('otp')};
V.otp=()=>`<div class="auth ctr"><button class="lnk" data-go="register" style="text-decoration:none;display:block">&lt; Back</button><h1>Enter your code</h1><p class="sub">We sent a 6-digit code to ${esc(S.tmp.phone)}.</p>
 <input id="otp" class="otp" inputmode="numeric" maxlength="6" value="482913" aria-label="6-digit code">
 <button class="btn g" style="margin-top:16px" data-act="verify">Verify and continue</button><button class="lnk" data-act="resend">Send a new code</button></div>`;
A.verify=()=>{S.user={name:S.tmp.name,phone:S.tmp.phone,email:'you@example.com'};toast('Welcome to Bushemi');go('home')};
A.resend=()=>toast('New code sent');
A.signout=()=>{S.user=null;go('welcome')};

/* ---------- home ---------- */
V.home=()=>{const m=S.mode||'home',up=S.appts.filter(a=>a.st!=='Completed'&&a.st!=='Cancelled')[0];return `
 <div class="hero"><h1>${S.user?'Hello, '+esc(first()):'How can we help?'}</h1><button class="loc" data-act="locsheet">📍 ${esc(S.loc)} &nbsp;▾</button>
  <div class="seg"><button class="${m==='home'?'on':''}" data-act="mode" data-v="home">Home visit</button><button class="${m==='tele'?'on':''}" data-act="mode" data-v="tele">Video consultation</button></div></div>
 <div style="padding:16px">
 ${up?`<div class="card next"><span class="muted">Your next appointment</span><div style="font-size:20px;font-weight:800">${fmt(dOf(up.d))}, ${up.tm}</div><div>${svcOf(up.svc).n}, ${esc(up.who)}</div><button class="btn sm w" style="margin-top:10px;width:100%" data-go="appts">View appointments</button></div>`:''}
 <h2 style="margin-top:6px">${m==='home'?'Home visit services':'Video consultations'}</h2>
 ${SERVICES.filter(s=>s.m===m).map(s=>`<button class="svc ${s.m==='tele'?'t':''}" data-act="svc" data-v="${s.id}"><div class="ic">${svg(s.i)}</div><div class="b"><b>${s.n}</b><small>${s.d}</small></div><div class="pr">${s.place?'Matched<br>for you':'from<br>'+kw(s.p)}</div></button>`).join('')}
 ${m==='home'?`<h2>Nurse care packages</h2><div class="pkg">${PACKAGES.map((k,i)=>`<div class="card"><b>${k.n}</b><div class="muted">Save on regular visits</div><div style="font-size:22px;font-weight:800;margin:6px 0">${kw(k.p)}</div><button class="btn sm g" style="width:100%" data-act="buypkg" data-v="${i}">Buy package</button></div>`).join('')}</div>${S.credits?`<p class="muted">You have ${S.credits} package visits left.</p>`:''}`:''}
 <h2>Need help?</h2><div class="quick"><a class="btn o" href="tel:+260973702227">Call us</a><a class="btn go" href="https://wa.me/260973702227" target="_blank" rel="noopener">WhatsApp</a></div></div>`};
A.mode=v=>{S.mode=v;keep('home')};
A.svc=v=>{const s=svcOf(v);if(s.place){S.pl.view='form';go('place');return}Object.assign(B,{svc:v,step:1,who:null,days:[],tm:null,addr:null,voucher:null});go('book')};
A.buypkg=v=>need(()=>{const k=PACKAGES[v];openPay(k.n,k.p,()=>{S.credits+=k.v;S.inv.unshift({t:k.n,a:k.p})})});
function promo(){sheet(`<div class="ctr"><div class="tick" style="font-size:36px">10%</div><h1>Welcome to Bushemi</h1><p class="sub">Use code <b>WELCOME10</b> on your first booking for 10% off.</p><button class="btn g" data-act="closeS">Start booking</button></div>`)}
A.closeS=()=>close();
A.locsheet=()=>sheet(`<h1>Where do you need care?</h1>${S.addrs.map(a=>`<button class="rdo ${S.loc===a.a?'on':''}" data-act="setloc" data-v="${esc(a.a)}"><div class="b"><b>${a.n}</b><span class="muted">${a.a}</span></div><span class="rd"></span></button>`).join('')}<button class="btn o" data-act="addaddr">+ Add a new address</button>`);
A.setloc=v=>{S.loc=v;close();keep(CUR)};
A.addaddr=()=>sheet(`<h1>Add an address</h1><label for="an">Name</label><input id="an" placeholder="For example: Office"><label for="aa">Area and street</label><input id="aa" placeholder="Area in Lusaka"><button class="btn" style="margin:10px 0" data-act="usegps">Use my current location</button><button class="btn g" data-act="saveaddr">Save address</button>`);
A.usegps=()=>{$('#aa').value='Chalala, near Hillview';toast('Location found')};
A.saveaddr=()=>{S.addrs.push({n:$('#an').value||'New address',a:$('#aa').value||'Lusaka'});close();toast('Address saved');if(CUR==='profile'||CUR==='book')keep(CUR)};
A.notif=()=>sheet(`<h1>Reminders</h1>${[['Video consultation on Tuesday at 10:00','Tomorrow'],['Reminder: keep your phone and camera ready','1 hour before'],['Receipt for your last booking is ready','20 Oct']].map(n=>`<div class="li"><div class="b"><b>${n[0]}</b><span class="muted">${n[1]}</span></div></div>`).join('')}`);

/* ---------- booking ---------- */
const BN=['Who is it for?','Choose date and time','Where?','Review and pay'];
const stepBar=()=>`<div class="steps">${BN.map((_,i)=>`<i class="${i<B.step?'on':''}"></i>`).join('')}</div>`;
const price=()=>svcOf(B.svc).p*B.days.length;
const disc=()=>B.voucher?Math.round(price()*VOUCHERS[B.voucher].pct/100):0;
V.book=()=>{const s=svcOf(B.svc),tele=s.m==='tele',h=`<button class="lnk" data-act="bback" style="text-decoration:none">&lt; Back</button><h1>${s.n}</h1><p class="muted" style="margin-bottom:6px">Step ${B.step} of 4: ${BN[B.step-1]}</p>${stepBar()}`;
 if(B.step===1)return h+S.fam.map(f=>`<button class="rdo ${B.who===f.n?'on':''}" data-act="bwho" data-v="${esc(f.n)}">${photo(f.n,'',44)}<div class="b"><b>${f.n}</b><span class="muted">${f.r}, ${f.a} years</span></div><span class="rd"></span></button>`).join('')+`<button class="btn o" data-act="addfam">+ Add a family member</button><button class="btn" style="margin-top:14px" data-act="bnext" ${B.who?'':'disabled'}>Continue</button>`;
 if(B.step===2){const pad=(DAYS[0].getDay()+6)%7;const times=tele?['08:00','10:00','12:00','14:00','16:00','18:00']:['Morning 07:00 to 12:00','Afternoon 12:00 to 17:00','Evening 17:00 to 21:00','08:00','10:00','14:00','16:00'];
  const fl=B.days.map(k=>flag(dOf(k))).filter(Boolean);
  return h+`<div class="lab" style="margin-top:0">Pick one or more days</div><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}${'<i></i>'.repeat(pad)}${DAYS.map(d=>`<button class="${B.days.includes(dkey(d))?'on':''} ${flag(d)?'hl':''}" data-act="bday" data-v="${dkey(d)}" aria-label="${fmt(d)}">${d.getDate()}<small>${d.toLocaleDateString('en-GB',{month:'short'})}</small></button>`).join('')}</div>
  ${B.days.length>1?`<p class="muted" style="margin-top:8px">${B.days.length} days chosen. Each day is its own appointment, paid together in one payment.</p>`:''}
  ${fl.length?`<div class="note">${[...new Set(fl)].join(' and ').replace('Same day','Same-day requests')} need confirmation from our team. Your booking will show as "On hold" until we confirm.</div>`:''}
  <div class="lab">${tele?'Time':'Time range or exact time'}</div><div class="chips">${times.map(t=>`<button class="chip ${B.tm===t?'on':''}" data-act="btm" data-v="${t}">${t}</button>`).join('')}</div>
  <button class="btn" style="margin-top:18px" data-act="bnext" ${B.days.length&&B.tm?'':'disabled'}>Continue</button>`}
 if(B.step===3)return h+(tele?`<div class="card" style="background:var(--green-soft);border:0"><b>No address needed</b><p class="muted">You will join by video from wherever you are. Make sure you have data or Wi-Fi.</p></div><label for="bn">Reason for consultation</label><textarea id="bn" placeholder="For example: headache for three days"></textarea>`:
  S.addrs.map(a=>`<button class="rdo ${B.addr===a.a?'on':''}" data-act="baddr" data-v="${esc(a.a)}"><div class="b"><b>${a.n}</b><span class="muted">${a.a}</span></div><span class="rd"></span></button>`).join('')+`<button class="btn o" data-act="addaddr">+ Add a new address</button><label for="bn">Notes for the nurse (optional)</label><textarea id="bn" placeholder="Gate colour, landmark, parking, care needed"></textarea>`)+
  `<button class="btn" style="margin-top:14px" data-act="bnext" ${tele||B.addr?'':'disabled'}>Continue</button>`;
 const p=price(),dc=disc();return h+`<div class="card"><b>${esc(B.who)}</b><div class="muted">${tele?'Video consultation':esc(B.addr)}</div>${B.days.slice().sort().map(k=>{const d=dOf(k);return `<div class="li"><div class="b">${fmt(d)}, ${B.tm}<br>${flag(d)?'<span class="pill p-a">Needs confirmation</span>':''}</div><b>${kw(s.p)}</b></div>`}).join('')}</div>
  <label for="bv" style="margin-top:0">Voucher code</label><div class="row"><input id="bv" placeholder="WELCOME10" value="${B.voucher||''}"><button class="btn sm o" style="flex:none" data-act="vapply">Apply</button></div>
  <div class="card" style="margin-top:12px"><div class="li" style="border:0"><div class="b">${B.days.length} appointment${B.days.length>1?'s':''}</div><b>${kw(p)}</b></div>${dc?`<div class="li" style="border:0;color:var(--green)"><div class="b">Voucher ${B.voucher}</div><b>-${kw(dc)}</b></div>`:''}<div class="tot"><span>Total</span><span>${kw(p-dc)}</span></div></div>
  <button class="btn g" data-act="bpay">Pay ${kw(p-dc)}</button><p class="muted ctr" style="margin-top:8px">One payment covers all days.</p>`};
A.bback=()=>{if(B.step>1){B.step--;keep('book')}else go('home')};
A.bnext=()=>{const n=$('#bn');if(n)B.note=n.value;B.step++;go('book')};
A.bwho=v=>{B.who=v;keep('book')};
A.bday=v=>{const i=B.days.indexOf(v);if(i>-1)B.days.splice(i,1);else B.days.push(v);keep('book')};
A.btm=v=>{B.tm=v;keep('book')};A.baddr=v=>{B.addr=v;keep('book')};
A.vapply=()=>{const c=$('#bv').value.trim().toUpperCase();if(VOUCHERS[c]){B.voucher=c;toast(VOUCHERS[c].t)}else{B.voucher=null;toast('That code is not valid')}keep('book')};
A.addfam=()=>sheet(`<h1>Add a family member</h1><label for="fn">Full name</label><input id="fn"><label for="fr">Relationship</label><select id="fr"><option>Mother</option><option>Father</option><option>Child</option><option>Spouse</option><option>Other</option></select><label for="fa">Age</label><input id="fa" type="number" min="0" max="110"><button class="btn g" style="margin-top:14px" data-act="savefam">Save</button>`);
A.savefam=()=>{S.fam.push({n:$('#fn').value.trim()||'Family member',r:$('#fr').value,a:$('#fa').value||'--'});close();if(CUR==='book'||CUR==='profile')keep(CUR)};
A.bpay=()=>need(()=>{const s=svcOf(B.svc),t=price()-disc(),n=B.days.length;
 openPay(`${s.n}, ${n} appointment${n>1?'s':''}`,t,()=>{B.days.slice().sort().forEach(k=>S.appts.push({id:Date.now()+Math.random(),svc:B.svc,who:B.who,d:k,tm:B.tm,st:flag(dOf(k))?'On hold':'Booked',addr:s.m==='tele'?'':B.addr}));S.inv.unshift({t:s.n,a:t})},'appts')});

/* ---------- appointments ---------- */
const STC={Booked:'p-b',Confirmed:'p-g','On hold':'p-a',Completed:'p-p',Cancelled:'p-r'};
V.appts=()=>{const past=['Completed','Cancelled'],list=S.appts.filter(a=>S.tab==='Past'?past.includes(a.st):!past.includes(a.st)).sort((a,b)=>dOf(a.d)-dOf(b.d));
 return `<h1>Appointments</h1><p class="sub">Your bookings and visit summaries.</p><div class="tabs">${['Upcoming','Past'].map(t=>`<button class="${S.tab===t?'on':''}" data-act="tab" data-v="${t}">${t}</button>`).join('')}</div>
 ${list.length?list.map(a=>{const s=svcOf(a.svc),d=dOf(a.d);return `<div class="card"><div class="li" style="border:0;padding:0"><div class="date">${d.getDate()}<small>${d.toLocaleDateString('en-GB',{month:'short'})}</small></div><div class="b"><b>${s.n}</b><span class="muted">${esc(a.who)}, ${a.tm}</span></div><span class="pill ${STC[a.st]}">${a.st}</span></div>
  ${a.st==='On hold'?'<div class="note">Waiting for our team to confirm this day.</div>':''}
  <div class="row" style="margin-top:12px">${S.tab==='Past'?(a.sum?`<button class="btn sm o" data-act="sum" data-v="${a.id}">Visit summary</button>`:'')+`<button class="btn sm" data-act="again" data-v="${a.svc}">Book again</button>`:
  `${s.m==='tele'&&a.st==='Confirmed'?`<button class="btn sm" data-act="join">Join call</button>`:''}<button class="btn sm o" data-act="resch" data-v="${a.id}">Reschedule</button><button class="btn sm r" data-act="canc" data-v="${a.id}">Cancel</button>`}</div></div>`}).join(''):`<div class="card ctr"><p class="muted">${S.tab==='Past'?'No past appointments yet.':'Nothing booked yet.'}</p><button class="btn sm" style="margin:10px auto 0" data-go="home">Book care</button></div>`}`};
A.tab=v=>{S.tab=v;keep('appts')};
A.again=v=>A.svc(v);
A.canc=v=>sheet(`<h1>Cancel this appointment?</h1><p class="sub">You can book again at any time.</p><div class="gap"><button class="btn r" data-act="cancyes" data-v="${v}">Yes, cancel</button><button class="btn o" data-act="closeS">Keep it</button></div>`);
A.cancyes=v=>{S.appts.find(a=>a.id==v).st='Cancelled';close();keep('appts');toast('Appointment cancelled')};
A.resch=v=>sheet(`<h1>Choose a new day</h1><div class="chips" style="margin:12px 0">${DAYS.slice(1,8).map(d=>`<button class="chip" data-act="reschd" data-v="${v}|${dkey(d)}">${fmt(d)}</button>`).join('')}</div>`);
A.reschd=v=>{const[i,d]=v.split('|'),a=S.appts.find(x=>x.id==i);a.d=d;a.st=flag(dOf(d))?'On hold':'Booked';close();keep('appts');toast('Appointment moved')};
A.sum=v=>{const a=S.appts.find(x=>x.id==v);sheet(`<h1>Visit summary</h1><p class="muted">${svcOf(a.svc).n}, ${fmt(dOf(a.d))}</p><p style="margin:10px 0 16px">${a.sum}</p><button class="btn o" data-act="closeS">Close</button>`)};
A.join=()=>sheet(`<div class="ctr"><div class="spin"></div><h1>Joining your call</h1><p class="sub">The video opens here when your doctor is ready. Check your camera and microphone.</p><button class="btn o" data-act="closeS">Close</button></div>`);

/* ---------- long-term caregiver placement ---------- */
const due=()=>!S.pl.paid.inquiry?['inquiry','Inquiry fee',FEES.inquiry]:!S.pl.paid.firstMonth&&S.pl.step>=4?['firstMonth','First month of care',FEES.firstMonth]:null;
V.place=()=>{const p=S.pl,sub=`<div class="tabs">${[['form','Request'],['list','Shortlist'],['status','Status']].map(t=>`<button class="${p.view===t[0]?'on':''}" data-act="pv" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
 const h=`<button class="lnk" data-go="home" style="text-decoration:none">&lt; Home</button><h1>Long-term caregiver</h1>`+sub;
 if(p.view==='form')return h+`<p class="sub">Tell us what you need. Bushemi matches you with checked caregivers.</p><div class="card"><label for="q1" style="margin-top:0">Who needs care?</label><input id="q1" value="Chanda Mwila"><label for="q2">Type of care</label><select id="q2"><option>Elderly care</option><option>Home nursing</option><option>Post-surgery care</option><option>Long-term illness care</option></select><label for="q3">Live-in or commuter?</label><select id="q3"><option>Live-in</option><option>Commuter</option></select><label for="q4">Schedule</label><select id="q4"><option>Day shift</option><option>Night shift</option><option>Day and night (24 hours)</option></select><label for="q5">Short note</label><textarea id="q5" placeholder="Mobility, diet, languages"></textarea></div><button class="btn g" data-act="plsub">Submit request</button>`;
 if(p.view==='list')return h+`<p class="sub">Choose your top two, then request an interview.</p>`+CGS.map(c=>`<button class="cg ${p.picks.includes(c.n)?'pick':''}" data-act="plpick" data-v="${c.n}">${photo(c.n,c.p)}<div><b>${c.n}</b> <span class="pill p-g">Verified</span><small>${c.q}, ${c.y} years</small><small>★ ${c.r} (${c.rv} reviews)</small><small>${c.a} · ${c.l}</small></div><div class="ck">✓</div></button>`).join('')+`<p class="muted ctr" style="margin:4px 0 12px">${p.picks.length} of 2 chosen</p><button class="btn g" data-act="plint" ${p.picks.length===2?'':'disabled'}>Request interview</button>`;
 const ST=[['Request received','We have your details.'],['Shortlist ready','Three caregivers are ready.'],['Interview','You meet your top two.'],['Confirmed','Your caregiver starts on the agreed date.']],d=due();
 return h+`<div class="card"><ul class="tl">${ST.map((x,i)=>`<li class="${i+1<p.step?'d':i+1===p.step?'n':''}"><i>${i+1<p.step?'✓':i+1}</i><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')}</ul></div>
 <div class="card"><b>Fees</b>${[['Inquiry fee',FEES.inquiry,p.paid.inquiry],['First month',FEES.firstMonth,p.paid.firstMonth],['Each month after that',FEES.monthly,null]].map(f=>`<div class="li"><div class="b">${f[0]}</div><b>${kw(f[1])}</b>${f[2]?'<span class="pill p-g">Paid</span>':''}</div>`).join('')}</div>
 ${d?`<button class="btn g" data-act="plpay">Pay ${kw(d[2])}, ${d[1]}</button>`:'<p class="muted ctr">All payments up to date.</p>'}${p.step<4?'<button class="btn o" style="margin-top:10px" data-act="pladv">Demo: move to next step</button>':''}`};
A.pv=v=>{S.pl.view=v;keep('place')};
A.plsub=()=>need(()=>{S.pl.view='list';sheet(`<div class="ctr"><div class="tick">✓</div><h1>Request received</h1><p class="sub">We found three caregivers for you.</p><button class="btn g" data-act="pv" data-v="list">View shortlist</button></div>`)});
A.plpick=v=>{const a=S.pl.picks,i=a.indexOf(v);if(i>-1)a.splice(i,1);else if(a.length<2)a.push(v);keep('place')};
A.plint=()=>{S.pl.step=Math.max(S.pl.step,3);S.pl.view='status';sheet(`<div class="ctr"><div class="tick">✓</div><h1>Interview requested</h1><p class="sub">We will contact ${S.pl.picks.join(' and ')} and call you with a time.</p><button class="btn" data-act="pv" data-v="status">See status</button></div>`)};
A.pladv=()=>{S.pl.step=Math.min(4,S.pl.step+1);keep('place')};
A.plpay=()=>{const d=due();openPay(d[1],d[2],()=>{S.pl.paid[d[0]]=true;if(d[0]==='firstMonth')S.pl.step=4;S.inv.unshift({t:d[1],a:d[2]})},'place')};

/* ---------- payments ---------- */
const P={};
const fields=k=>k==='card'?`<label for="cn">Card number</label><input id="cn" value="4242 4242 4242 4242"><div class="row"><div><label for="ce">Expiry</label><input id="ce" value="08/29"></div><div><label for="cv">CVV</label><input id="cv" value="123" type="password"></div></div>`:`<label for="mn">Mobile money number</label><input id="mn" type="tel" value="${{mtn:'096 123 4567',airtel:'097 123 4567',zamtel:'095 123 4567'}[k]}">`;
function openPay(title,amount,done,ret){Object.assign(P,{title,amount,done,ret:ret||CUR});const d=S.methods.find(m=>m.def);P.key=d?'s'+d.id:'k:mtn';drawPay()}
function drawPay(){
 const saved=S.methods.map(m=>({key:'s'+m.id,k:m.k,n:m.n,s:m.s})),others=Object.keys(KINDS).map(k=>({key:'k:'+k,k,n:KINDS[k][0],s:'Use a new '+(k==='card'?'card':k==='cash'||k==='bank'?'option':'number')}));
 const all=[...saved,...others],sel=all.find(o=>o.key===P.key)||all[0];P.name=sel.n;let det='';
 if(sel.key.startsWith('k:')){const k=sel.k;det=k==='card'?fields('card'):k==='bank'?'<p class="muted" style="margin-top:10px">Bank details and a payment reference are sent by SMS after you tap Pay.</p>':k==='cash'?'<p class="muted" style="margin-top:10px">Pay at the clinic or at your first visit. Your booking is held for 48 hours.</p>':fields(k);
  if(k!=='bank'&&k!=='cash')det+='<label class="chk"><input type="checkbox" id="svp"><span>Save this method for next time</span></label>'}
 else det=`<p class="muted" style="margin-top:6px">You will get a prompt on ${sel.s} to approve the payment.</p>`;
 const o=x=>`<button class="rdo ${x.key===P.key?'on':''}" data-act="psel" data-v="${x.key}">${mi(x.k)}<div class="b"><b>${x.n}</b><span class="muted">${x.s}</span></div><span class="rd"></span></button>`;
 sheet(`<h1 class="ctr" style="font-size:19px">${esc(P.title)}</h1><div class="amt">${kw(P.amount)}</div>${saved.length?'<div class="lab" style="margin-top:0">Saved methods</div>':''}${saved.map(o).join('')}<div class="lab">Other ways to pay</div>${others.map(o).join('')}${det}<button class="btn g" style="margin-top:14px" data-act="dopay">${sel.key==='k:cash'?'Reserve and pay at clinic':'Pay '+kw(P.amount)}</button>`)}
A.psel=v=>{const y=$('#sheet').scrollTop;P.key=v;drawPay();$('#sheet').scrollTop=y};
A.dopay=()=>{const sv=$('#svp');if(sv&&sv.checked){const k=P.key.slice(2),c=k==='card',n=c?$('#cn').value.replace(/\s/g,'').slice(-4):$('#mn').value;S.methods.push({id:Date.now(),k,n:KINDS[k][0],s:c?'ending '+n:n,def:!S.methods.length})}
 const mm=P.key==='k:cash'||P.key==='k:bank'?'':' Enter your PIN on your phone to approve.';
 sheet(`<div class="ctr"><div class="spin"></div><h1>Processing payment</h1><p class="sub">${kw(P.amount)} to Bushemi Clinic.${mm}</p></div>`);
 setTimeout(()=>{P.done&&P.done();sheet(`<div class="ctr"><div class="tick">✓</div><h1>${P.key==='k:cash'?'Booking reserved':'Payment received'}</h1><p class="sub">${kw(P.amount)} · ${esc(P.title)}<br>${esc(P.name)}</p><p class="muted">You will get an SMS reminder before your appointment.</p><button class="btn g" style="margin-top:12px" data-act="paydone">Done</button></div>`)},2200)};
A.paydone=()=>{close();go(P.ret==='book'?'appts':P.ret)};

/* ---------- help ---------- */
V.help=()=>`<h1>Help centre</h1><p class="sub">We are here when you need us.</p><div class="quick"><a class="btn" href="tel:+260973702227">Call us</a><a class="btn g" href="https://wa.me/260973702227" target="_blank" rel="noopener">WhatsApp chat</a></div>
 <h2>Common questions</h2><div class="card">${[['How do I book a home visit?','Choose a service on the Home screen, pick who it is for, choose your days and time, add your address, and pay. You will get a reminder before each visit.'],['Can I book more than one day?','Yes. Pick several days in one booking. Each day is a separate appointment and you pay once.'],['What if I book on a Sunday or the same day?','Our team checks availability first. Your booking shows as "On hold" until we confirm it.'],['How do video consultations work?','Tap "Join call" on your appointment a few minutes before it starts. You need data or Wi-Fi and a working camera.'],['Which payment methods can I use?','MTN Mobile Money, Airtel Money, Zamtel Kwacha, Visa or Mastercard, bank transfer, or pay at the clinic.'],['How does long-term caregiver matching work?','Send a request, choose your top two from three checked caregivers, meet them for an interview, then confirm.'],['Is my health information private?','Yes. Only you, your care team and family members you invite can see your records.']].map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div>
 <h2>Visit us</h2><div class="card"><b>Bushemi Clinic</b><p class="muted">Plot 15564/M/S Hillview, Chalala, Lusaka<br>Open for appointments every day. Home visits depend on availability.</p></div>`;

/* ---------- profile ---------- */
const tgl=(k,t,s)=>`<div class="li"><div class="b"><b>${t}</b><span class="muted">${s}</span></div><button class="sw ${S.tg[k]?'on':''}" data-act="tg" data-v="${k}" role="switch" aria-checked="${S.tg[k]}" aria-label="${t}"></button></div>`;
const mrows=()=>S.methods.map(m=>`<div class="li">${mi(m.k)}<div class="b"><b>${m.n}</b><span class="muted">${m.s}</span></div>${m.def?'<span class="pill p-g">Default</span>':`<button class="btn sm o" data-act="mdef" data-v="${m.id}">Default</button>`}<button class="btn sm r" data-act="mdel" data-v="${m.id}" aria-label="Remove ${m.n}">Remove</button></div>`).join('');
V.profile=()=>{if(!S.user)return `<div class="card ctr"><h1>You are browsing as a guest</h1><p class="sub">Sign in to book, save family members and pay faster.</p><div class="gap"><button class="btn" data-go="login">Sign in</button><button class="btn o" data-go="register">Create account</button></div></div>`;
 return `<div class="card ctr"><div style="display:flex;justify-content:center">${photo(ini(),PIC+'women/65.jpg',92)}</div><h1 style="margin-top:10px">${esc(S.user.name)}</h1><p class="muted">${esc(S.user.phone)} · ${esc(S.user.email)}</p><button class="btn sm o" style="margin:10px auto 0" data-act="editp">Edit details</button></div>
 <h2>Family members<a data-act="addfam">+ Add</a></h2><div class="card">${S.fam.map(f=>`<div class="li">${photo(f.n,'',44)}<div class="b"><b>${f.n}</b><span class="muted">${f.r}, ${f.a} years</span></div></div>`).join('')}</div>
 <h2>Saved addresses<a data-act="addaddr">+ Add</a></h2><div class="card">${S.addrs.map(a=>`<div class="li"><div class="b"><b>${a.n}</b><span class="muted">${a.a}</span></div></div>`).join('')}</div>
 <h2>Payment methods<a data-act="addm">+ Add</a></h2><div class="card">${S.methods.length?mrows():'<p class="muted">No saved methods yet.</p>'}<p class="muted" style="margin-top:8px">Saved methods mean you do not retype your details each time.</p></div>
 <h2>Vouchers</h2><div class="card"><div class="li" style="border:0"><div class="b"><b>WELCOME10</b><span class="muted">10% off your first booking</span></div><span class="pill p-g">Ready</span></div></div>
 <h2>Payment history</h2><div class="card">${S.inv.length?S.inv.map(i=>`<div class="li"><div class="b"><b>${i.t}</b><span class="muted">31 Oct 2026</span></div><b>${kw(i.a)}</b></div>`).join(''):'<p class="muted">No payments yet.</p>'}</div>
 <h2>Reminders</h2><div class="card">${tgl('push','Phone notifications','Before every appointment')}${tgl('sms','SMS reminders','Works without data')}${tgl('wa','WhatsApp reminders','Updates in WhatsApp')}</div>
 <h2>Settings</h2><div class="card"><div class="li"><div class="b"><b>Language</b></div><select id="lng" style="width:150px">${['English','Nyanja','Bemba'].map(l=>`<option ${S.lang===l?'selected':''}>${l}</option>`).join('')}</select></div>${tgl('bio','Fingerprint sign in','Faster and more private')}</div>
 <div class="gap"><button class="btn r" data-act="signout">Sign out</button></div><button class="lnk" data-go="admin" style="display:block;margin:10px auto 0;color:var(--muted);font-size:14px">Staff portal</button>`};
A.tg=v=>{S.tg[v]=!S.tg[v];keep('profile')};
document.addEventListener('change',e=>{if(e.target.id==='lng'){S.lang=e.target.value;toast('Language set to '+S.lang+' (preview only)')}});
A.editp=()=>sheet(`<h1>Edit details</h1><label for="en">Full name</label><input id="en" value="${esc(S.user.name)}"><label for="ep">Mobile number</label><input id="ep" value="${esc(S.user.phone)}"><label for="ee">Email</label><input id="ee" value="${esc(S.user.email)}"><button class="btn g" style="margin-top:14px" data-act="savep">Save changes</button>`);
A.savep=()=>{S.user={name:$('#en').value.trim()||S.user.name,phone:$('#ep').value,email:$('#ee').value};close();go('profile');toast('Details saved')};
A.mdef=v=>{S.methods.forEach(m=>m.def=m.id==v);keep('profile')};
A.mdel=v=>{S.methods=S.methods.filter(m=>m.id!=v);if(S.methods.length&&!S.methods.some(m=>m.def))S.methods[0].def=true;keep('profile')};
const NM={k:'mtn'};
A.addm=()=>{NM.k='mtn';sheet(`<h1>Add a payment method</h1><p class="sub">Only the last digits are shown after saving.</p><div class="chips">${['mtn','airtel','zamtel','card'].map(k=>`<button class="chip ${k==='mtn'?'on':''}" data-act="nk" data-v="${k}">${KINDS[k][0]}</button>`).join('')}</div><div id="nf">${fields('mtn')}</div><label class="chk"><input type="checkbox" id="mdf"><span>Make this my default method</span></label><button class="btn g" data-act="savem">Save method</button>`)};
A.nk=(v,b)=>{NM.k=v;$$('.chip').forEach(c=>c.classList.toggle('on',c===b));$('#nf').innerHTML=fields(v)};
A.savem=()=>{const k=NM.k,c=k==='card',n=c?$('#cn').value.replace(/\s/g,'').slice(-4):$('#mn').value,d=$('#mdf').checked;if(d||!S.methods.length)S.methods.forEach(m=>m.def=false);S.methods.push({id:Date.now(),k,n:KINDS[k][0],s:c?'ending '+n:n,def:d||!S.methods.length});close();toast('Payment method saved');if(CUR==='profile')keep('profile')};

/* ---------- staff portal ---------- */
const ADM=[{n:'Mrs Mwila',t:'Nurse home visit, 3 Nov',s:'On hold',p:true},{n:'Mr Banda',t:'Doctor video consultation, 2 Nov',s:'Booked',p:true},{n:'Mrs Phiri',t:'Physiotherapist home visit, 4 Nov',s:'Confirmed',p:false},{n:'Mr Tembo',t:'Nurse home visit, 20 Oct',s:'Completed',p:true}];
const AS=['Booked','Confirmed','On hold','Completed'];
const CG2=[{n:'Grace',q:'Registered Nurse',v:''},{n:'Natasha',q:'Enrolled Nurse',v:''},{n:'Mercy',q:'Certified Caregiver',v:'ok'},{n:'Joseph',q:'Enrolled Nurse',v:''}];
V.admin=()=>`<div class="bar"><b>Bushemi staff</b><button class="btn sm w" data-act="leave">Back to app</button></div><div style="padding:16px">
 <div class="row"><div class="card ctr" style="margin:0"><b style="font-size:26px">${ADM.filter(a=>a.s==='On hold').length}</b><br><span class="muted">Waiting to confirm</span></div><div class="card ctr" style="margin:0"><b style="font-size:26px">${ADM.length}</b><br><span class="muted">Appointments</span></div></div>
 <h2>Appointments</h2><p class="muted" style="margin:-4px 0 8px">Tap a status to change it.</p>${ADM.map((r,i)=>`<div class="card"><div class="li" style="border:0;padding:0"><div class="b"><b>${r.n}</b><span class="muted">${r.t}</span></div><button class="pill ${STC[r.s]}" style="border:0;font:inherit;font-weight:700;min-height:44px;cursor:pointer;padding:0 14px" data-act="ast" data-v="${i}">${r.s}</button></div><div class="li" style="border:0;padding:10px 0 0"><div class="b">Payment received</div><button class="sw ${r.p?'on':''}" data-act="apay" data-v="${i}" role="switch" aria-checked="${r.p}" aria-label="Payment received for ${r.n}"></button></div></div>`).join('')}
 <h2>Caregiver approvals</h2>${CG2.map((c,i)=>`<div class="card"><div class="li" style="border:0;padding:0"><div class="b"><b>${c.n}</b><span class="muted">${c.q}</span></div><button class="btn sm ${c.v==='ok'?'g':'go'}" data-act="cap" data-v="${i}:ok">${c.v==='ok'?'Approved':'Approve'}</button><button class="btn sm ${c.v==='no'?'':'r'}" style="${c.v==='no'?'background:var(--red)':''}" data-act="cap" data-v="${i}:no">${c.v==='no'?'Rejected':'Reject'}</button></div></div>`).join('')}</div>`;
const adm=()=>{const y=$('#cur').scrollTop;go('admin');$('#cur').scrollTop=y};
A.ast=v=>{const r=ADM[v];r.s=AS[(AS.indexOf(r.s)+1)%4];adm()};A.apay=v=>{ADM[v].p=!ADM[v].p;adm()};
A.cap=v=>{const[i,k]=v.split(':');CG2[i].v=CG2[i].v===k?'':k;adm()};
A.leave=()=>go(S.user?'home':'welcome');
go('welcome');
</script>
</body></html>
